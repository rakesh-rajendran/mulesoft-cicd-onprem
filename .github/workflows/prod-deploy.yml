name: Deploy to PROD
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: 8

    - name: Extract group ID from POM
      id: pom-info
      run: |
        # Extract groupId from pom.xml
        groupId=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
        echo "group-id=$groupId" >> $GITHUB_OUTPUT
        echo "Found group ID: $groupId"

    - name: Download artifact from Exchange or rebuild
      run: |
        # Try to download from Exchange using extracted group ID
        if [ -n "${{ steps.pom-info.outputs.group-id }}" ]; then
          echo "Attempting to download from Exchange..."
          if mvn dependency:copy \
          -Dartifact=${{ steps.pom-info.outputs.group-id }}:${{ github.event.repository.name }}:LATEST \
          -DoutputDirectory=target \
          --settings .maven/settings.xml \
          -Dclient.id="${{ secrets.CONNECTED_APP_CLIENT_ID }}" \
          -Dclient.secret="${{ secrets.CONNECTED_APP_CLIENT_SECRET }}"; then
            echo "Successfully downloaded from Exchange"
          else
            echo "Failed to download from Exchange, rebuilding..."
            mvn clean compile test package -DskipMunitTests
          fi
        else
          echo "Could not extract group ID, rebuilding application..."
          mvn clean compile test package -DskipMunitTests
        fi
        
        # Verify artifact exists
        if ! ls target/*.jar 1> /dev/null 2>&1; then
          echo "Error: No JAR file found in target directory"
          ls -la target/
          exit 1
        fi

    - name: Create dynamic settings.xml
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
          
          <proxies>
          </proxies>

          <servers>
            <server>
              <id>Repository</id>
              <username>~~~Client~~~</username>
              <password>${CONNECTED_APP_CLIENT_ID}~?~${CONNECTED_APP_CLIENT_SECRET}</password>
            </server>
          </servers>
          
          <pluginGroups>
            <pluginGroup>org.mule.tools</pluginGroup>
          </pluginGroups>

          <profiles>
            <profile>
              <id>mule-extra-repos</id>
              <activation>
                <activeByDefault>true</activeByDefault>
              </activation>
              <repositories>
                <repository>
                  <id>mule-public</id>
                  <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                </repository>
                <repository>
                  <id>mulesoft-releases</id>
                  <url>https://repository.mulesoft.org/releases/</url>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>mule-public</id>
                  <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                </pluginRepository>
                <pluginRepository>
                  <id>mulesoft-releases</id>
                  <url>https://repository.mulesoft.org/releases/</url>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
        </settings>
        EOF
      env:
        CONNECTED_APP_CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
        CONNECTED_APP_CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}

    - name: Deploy to On-Prem PROD Server
      run: |
        echo "🚀 Deploying to mac-prod on-premise server"
        
        mvn deploy -DmuleDeploy \
          -DskipTests \
          -s ~/.m2/settings.xml \
          -Dclient.id="${{ secrets.CONNECTED_APP_CLIENT_ID }}" \
          -Dclient.secret="${{ secrets.CONNECTED_APP_CLIENT_SECRET }}" \
          -Denvironment=PROD
        
        echo "✅ Application deployed successfully to mac-prod"