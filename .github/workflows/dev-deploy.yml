name: Build, Publish and Deploy to DEV
on:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
      commit-hash: ${{ steps.artifact.outputs.hash }}
    
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-onprem-m2-${{ hashFiles('pom.xml') }}
        restore-keys: ${{ runner.os }}-onprem-m2

    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: 8
    
    - name: Build and Test
      run: mvn clean compile test package
      
    - name: Stamp artifact file name with commit hash
      id: artifact
      run: |
        # Check if JAR file exists first
        if ls target/*.jar 1> /dev/null 2>&1; then
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo $artifactName1 | sed "s/.jar/-$commitHash.jar/g")
          mv $artifactName1 $artifactName2
          artifactName=$(basename $artifactName2)
          echo "name=$artifactName" >> $GITHUB_OUTPUT
          echo "hash=$commitHash" >> $GITHUB_OUTPUT
          echo "Artifact created: $artifactName"
        else
          echo "Error: No JAR file found in target directory"
          ls -la target/
          exit 1
        fi

    - name: Upload artifact for reuse
      uses: actions/upload-artifact@v4
      with:
        name: mule-app-${{ github.sha }}
        path: target/*.jar
        retention-days: 30

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    environment: development
    outputs:
      result: ${{ steps.deploy.outputs.result }}
    
    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: 8

    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-onprem-deploy-m2-${{ hashFiles('pom.xml') }}
        restore-keys: ${{ runner.os }}-onprem-deploy-m2

    - name: Create dynamic settings.xml
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
          
          <proxies>
          </proxies>

          <servers>
            <server>
              <id>Repository</id>
              <username>~~~Client~~~</username>
              <password>${CONNECTED_APP_CLIENT_ID}~?~${CONNECTED_APP_CLIENT_SECRET}</password>
            </server>
          </servers>
          
          <pluginGroups>
            <pluginGroup>org.mule.tools</pluginGroup>
          </pluginGroups>

          <profiles>
            <profile>
              <id>mule-extra-repos</id>
              <activation>
                <activeByDefault>true</activeByDefault>
              </activation>
              <repositories>
                <repository>
                  <id>mule-public</id>
                  <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                </repository>
                <repository>
                  <id>mulesoft-releases</id>
                  <url>https://repository.mulesoft.org/releases/</url>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>mule-public</id>
                  <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                </pluginRepository>
                <pluginRepository>
                  <id>mulesoft-releases</id>
                  <url>https://repository.mulesoft.org/releases/</url>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
        </settings>
        EOF
      env:
        CONNECTED_APP_CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
        CONNECTED_APP_CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: mule-app-${{ github.sha }}
        path: target/

    - name: Get application version from POM
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "📦 Application version: ${VERSION}"

    - name: Validate artifact exists
      run: |
        if ! ls target/*.jar 1> /dev/null 2>&1; then
          echo "❌ Error: No JAR file found in target directory"
          echo "Available files in target:"
          ls -la target/ || echo "target directory not found"
          exit 1
        fi
        echo "✅ Artifact validation successful"

    - name: Deploy to On-Prem DEV Server
      id: deploy
      run: |
        echo "🚀 Deploying to mac-dev on-premise server"
        
        mvn deploy -DmuleDeploy \
          -DskipTests \
          -s ~/.m2/settings.xml \
          -Dclient.id="${{ secrets.CONNECTED_APP_CLIENT_ID }}" \
          -Dclient.secret="${{ secrets.CONNECTED_APP_CLIENT_SECRET }}" \
          -Denvironment=DEV
        
        echo "✅ Application deployed successfully to mac-dev"
        echo "result=success" >> $GITHUB_OUTPUT
      env:
        CONNECTED_APP_CLIENT_ID: ${{ secrets.CONNECTED_APP_CLIENT_ID }}
        CONNECTED_APP_CLIENT_SECRET: ${{ secrets.CONNECTED_APP_CLIENT_SECRET }}

    - name: Generate Deployment Report
      if: always()
      run: |
        echo "## On-Premise Deployment Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ${{ steps.deploy.outputs.result || 'failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Application**: mulesoft-cicd-onprem" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: DEV" >> $GITHUB_STEP_SUMMARY
        echo "- **Target Server**: mac-dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.deploy.outputs.result }}" != "success" ]; then
          echo "❌ Deployment failed. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
        fi